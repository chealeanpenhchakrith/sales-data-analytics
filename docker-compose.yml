services:
  spark-master:
    image: apache/spark:3.5.0
    container_name: sales-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "0.0.0.0", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./:/app
    working_dir: /app

  spark-worker:
    image: apache/spark:3.5.0
    container_name: sales-spark-worker
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "2", "--memory", "2G", "--webui-port", "8081"]
    ports:
      - "8081:8081"
    volumes:
      - ./:/app
    working_dir: /app

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: sales-hdfs-namenode
    environment:
      - CLUSTER_NAME=sales-data-analytics
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hdfs-namenode:/hadoop/dfs/name
      - ./src/data:/data
      - ./src/data/Online Retail.csv:/upload/online_retail.csv:ro

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: sales-hdfs-datanode
    depends_on:
      - namenode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SERVICE_PRECONDITION=namenode:9870
    ports:
      - "9864:9864"
    volumes:
      - hdfs-datanode:/hadoop/dfs/data

volumes:
  hdfs-namenode:
  hdfs-datanode:
